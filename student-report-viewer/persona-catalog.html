<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Persona Types | ICAN STELLAR</title>
  <link rel="stylesheet" href="css/persona-styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .catalog-header { text-align: center; color: white; margin-bottom: 30px; padding: 30px 0 10px; }
    .catalog-header h1 { font-size: 2.2em; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); margin-bottom: 8px; }
    .catalog-header p { opacity: 0.9; font-size: 1.05rem; }
    .catalog-nav { display: flex; justify-content: center; gap: 10px; margin-bottom: 8px; }
    .catalog-nav a {
      color: white; text-decoration: none; background: rgba(255,255,255,0.18);
      padding: 8px 18px; border-radius: 20px; font-size: 0.9rem; font-weight: 600; transition: background 0.2s;
    }
    .catalog-nav a:hover { background: rgba(255,255,255,0.35); }
    .catalog-container { max-width: 1200px; margin: 0 auto; }

    .group-section { margin-bottom: 32px; }
    .group-header {
      background: white; border-radius: 14px; padding: 16px 24px; margin-bottom: 14px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.08); display: flex; align-items: center; gap: 14px;
    }
    .group-header h2 { font-size: 1.3rem; color: #667eea; margin: 0; }
    .group-header p { color: #888; font-size: 0.85rem; margin: 2px 0 0; }
    .group-count {
      margin-left: auto; background: #667eea; color: white;
      padding: 3px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600;
    }

    .personas-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 14px; }

    /* Card */
    .pc { background: white; border-radius: 14px; box-shadow: 0 6px 16px rgba(0,0,0,0.08); overflow: hidden; transition: all 0.3s; }
    .pc:hover { transform: translateY(-3px); box-shadow: 0 10px 28px rgba(102,126,234,0.2); }

    .pc-banner {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 16px 20px; color: white; display: flex; align-items: center; gap: 14px;
    }
    .pc-emoji {
      font-size: 2.2rem; background: rgba(255,255,255,0.15);
      width: 54px; height: 54px; display: flex; align-items: center; justify-content: center;
      border-radius: 50%; flex-shrink: 0;
    }
    .pc-banner h3 { font-size: 1.1rem; font-weight: 700; margin: 0 0 2px; }
    .pc-tagline { font-size: 0.8rem; opacity: 0.88; }
    .pc-core {
      display: inline-block; margin-top: 6px; background: rgba(255,255,255,0.22);
      padding: 2px 10px; border-radius: 12px; font-size: 0.72rem; font-weight: 600;
    }

    .pc-body { padding: 16px 20px; }

    /* Quick-glance row */
    .pc-glance { display: flex; gap: 16px; margin-bottom: 12px; flex-wrap: wrap; }
    .pc-glance-item { display: flex; flex-direction: column; }
    .pc-glance-label { font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.6px; color: #aaa; font-weight: 600; }
    .pc-glance-value { font-size: 0.82rem; font-weight: 600; color: #333; }

    /* Keyword chips */
    .pc-section { margin-bottom: 12px; }
    .pc-section-label {
      font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.6px;
      color: #999; font-weight: 700; margin-bottom: 6px; display: flex; align-items: center; gap: 5px;
    }
    .pc-chips { display: flex; flex-wrap: wrap; gap: 5px; }
    .chip {
      font-size: 0.76rem; font-weight: 500; padding: 4px 10px; border-radius: 14px;
      border: 1px solid #e8e8e8; background: #fafafa; color: #555; white-space: nowrap;
    }
    .chip.green { background: #f0fdf4; border-color: #bbf7d0; color: #15803d; }
    .chip.amber { background: #fffbeb; border-color: #fde68a; color: #b45309; }
    .chip.blue { background: #f0f9ff; border-color: #bae6fd; color: #0369a1; }
    .chip.purple { background: #f5f3ff; border-color: #ddd6fe; color: #7c3aed; }
    .chip.dim { background: #f0f4ff; border-color: #dce3ff; color: #667eea; font-weight: 600; }
    .chip.dim.dominant { background: #667eea; border-color: #667eea; color: white; }

    /* Path row */
    .pc-path { display: flex; gap: 0; align-items: stretch; margin-bottom: 10px; }
    .pc-path-step {
      flex: 1; text-align: center; padding: 8px 6px; font-size: 0.72rem; font-weight: 600;
      color: white; position: relative;
    }
    .pc-path-step:first-child { border-radius: 8px 0 0 8px; }
    .pc-path-step:last-child { border-radius: 0 8px 8px 0; }
    .pc-path-step:nth-child(1) { background: #667eea; }
    .pc-path-step:nth-child(2) { background: #0ea5e9; }
    .pc-path-step:nth-child(3) { background: #10b981; }
    .pc-path-step:nth-child(4) { background: #f59e0b; }
    .pc-path-phase {
      display: block; font-size: 0.58rem; text-transform: uppercase;
      letter-spacing: 0.4px; opacity: 0.75; margin-bottom: 2px;
    }

    /* Careers compact */
    .pc-careers { display: flex; flex-wrap: wrap; gap: 5px; }
    .career-chip {
      font-size: 0.74rem; font-weight: 600; padding: 4px 10px; border-radius: 14px;
      background: linear-gradient(135deg, rgba(102,126,234,0.1), rgba(118,75,162,0.1));
      border: 1px solid rgba(102,126,234,0.25); color: #555;
    }
    .career-chip .cf { font-size: 0.62rem; color: #888; font-weight: 400; margin-left: 4px; }

    /* Expand for full detail */
    .pc-toggle {
      background: none; border: 1px solid #e0e0e0; color: #667eea;
      padding: 5px 14px; border-radius: 16px; font-size: 0.76rem; font-weight: 600;
      cursor: pointer; transition: all 0.2s; margin-top: 4px;
    }
    .pc-toggle:hover { background: #667eea; color: white; border-color: #667eea; }
    .pc-full { display: none; margin-top: 14px; border-top: 1px solid #eee; padding-top: 14px; }
    .pc.expanded .pc-full { display: block; }
    .pc.expanded .pc-toggle-more { display: none; }
    .pc-toggle-less { display: none; }
    .pc.expanded .pc-toggle-less { display: inline-block; }

    .pc-full-list { list-style: none; padding: 0; margin: 0 0 12px; }
    .pc-full-list li {
      font-size: 0.82rem; color: #555; line-height: 1.5;
      padding: 4px 0 4px 22px; position: relative;
    }
    .pc-full-list li::before { position: absolute; left: 0; }
    .pc-full-list.s li::before { content: '💎'; font-size: 0.75rem; }
    .pc-full-list.w li::before { content: '🔍'; font-size: 0.75rem; }
    .pc-full-list.a li::before { content: '⛏️'; font-size: 0.75rem; }
    .pc-full-list.g li::before { content: '🌅'; font-size: 0.75rem; }
    .pc-full-section h5 {
      font-size: 0.78rem; font-weight: 700; color: #667eea; margin: 0 0 6px;
      text-transform: uppercase; letter-spacing: 0.4px;
    }
    .pc-full-section { margin-bottom: 12px; }
    .pc-full-career {
      background: #f8f9ff; border: 1px solid #e8e8e8; border-radius: 8px; padding: 10px 12px; margin-bottom: 6px;
    }
    .pc-full-career strong { font-size: 0.84rem; color: #333; }
    .pc-full-career .fc-field {
      font-size: 0.65rem; background: #667eea; color: white;
      padding: 1px 7px; border-radius: 8px; margin-left: 6px; font-weight: 600;
    }
    .pc-full-career p { font-size: 0.8rem; color: #666; margin: 3px 0 0; }

    @media (max-width: 768px) {
      .personas-grid { grid-template-columns: 1fr; }
      .catalog-nav { flex-wrap: wrap; }
      .pc-path-step { font-size: 0.65rem; padding: 6px 4px; }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="catalog-header">
      <h1>🌟 The 21 Learner Personas</h1>
      <p>Every student has a unique learner identity. Discover all the types below.</p>
    </div>
    <div class="catalog-nav">
      <a href="persona.html">← Student Profiles</a>
      <a href="index.html">← Report Viewer</a>
    </div>
    <div class="catalog-container" id="catalog-container">
      <div class="loading-state"><div class="spinner"></div><p>Loading persona types...</p></div>
    </div>
  </div>
  <footer class="footer"><p>Powered by ICAN STELLAR Assessment System</p></footer>

  <script>
    const DIM_LABELS = { EI:'Interest', SC:'Work Style', PT:'Learning', RN:'Change', AD:'Decision', LG:'Focus' };
    const PHASES = ['Awareness', 'Focus', 'Depth', 'Impact'];

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const res = await fetch('/api/persona-types');
        const data = await res.json();
        // Load all full type data in parallel
        const fullTypes = await Promise.all(
          data.types.map(t => fetch('/api/persona-types/' + t.id).then(r => r.json()))
        );
        const typeMap = {};
        fullTypes.forEach(t => typeMap[t.id] = t);
        renderCatalog(data.groups, typeMap);
      } catch (err) {
        document.getElementById('catalog-container').innerHTML =
          '<p style="color:red;text-align:center;padding:40px;">Error loading persona types.</p>';
      }
    });

    function renderCatalog(groups, typeMap) {
      const container = document.getElementById('catalog-container');
      container.innerHTML = groups.map(group => `
        <div class="group-section">
          <div class="group-header">
            <div><h2>${group.name}</h2><p>${group.description}</p></div>
            <span class="group-count">${group.types.length} types</span>
          </div>
          <div class="personas-grid">
            ${group.types.map(id => renderCard(typeMap[id])).join('')}
          </div>
        </div>
      `).join('');
    }

    function renderCard(t) {
      if (!t) return '';
      const k = t.keywords || {};
      const dims = ['EI','SC','PT','RN','AD','LG'];
      const dom = t.dominantDimensions || [];

      return `<div class="pc" id="card-${t.id}">
        <div class="pc-banner">
          <div class="pc-emoji">${t.emoji}</div>
          <div>
            <h3>${t.name}</h3>
            <div class="pc-tagline">${t.tagline}</div>
            ${k.coreTrait ? `<span class="pc-core">${k.coreTrait}</span>` : ''}
          </div>
        </div>
        <div class="pc-body">

          <div class="pc-glance">
            ${k.learnsBy ? `<div class="pc-glance-item"><span class="pc-glance-label">Learns by</span><span class="pc-glance-value">${k.learnsBy}</span></div>` : ''}
            ${k.inClass ? `<div class="pc-glance-item"><span class="pc-glance-label">In class</span><span class="pc-glance-value">${k.inClass}</span></div>` : ''}
          </div>

          <div class="pc-section">
            <div class="pc-section-label">💎 Strengths</div>
            <div class="pc-chips">${(k.strengths || []).map(s => `<span class="chip green">${s}</span>`).join('')}</div>
          </div>

          <div class="pc-section">
            <div class="pc-section-label">🔍 Blind Spots</div>
            <div class="pc-chips">${(k.blindSpots || []).map(s => `<span class="chip amber">${s}</span>`).join('')}</div>
          </div>

          <div class="pc-section">
            <div class="pc-section-label">⛏️ Future Assets</div>
            <div class="pc-chips">${(k.assets || []).map(s => `<span class="chip blue">${s}</span>`).join('')}</div>
          </div>

          <div class="pc-section">
            <div class="pc-section-label">🌅 Goals</div>
            <div class="pc-chips">${(k.goals || []).map(s => `<span class="chip purple">${s}</span>`).join('')}</div>
          </div>

          <div class="pc-section">
            <div class="pc-section-label">🚀 Careers</div>
            <div class="pc-careers">${(t.careerDirections || []).map(c =>
              `<span class="career-chip">${c.title}<span class="cf">${c.field}</span></span>`
            ).join('')}</div>
          </div>

          <div class="pc-section">
            <div class="pc-section-label">🛤️ Growth Path</div>
            <div class="pc-path">${(k.pathSteps || []).map((s, i) =>
              `<div class="pc-path-step"><span class="pc-path-phase">${PHASES[i]}</span>${s}</div>`
            ).join('')}</div>
          </div>

          <div class="pc-section">
            <div class="pc-section-label">🧬 Dominant Dimensions</div>
            <div class="pc-chips">${dims.map(d =>
              `<span class="chip dim ${dom.includes(d) ? 'dominant' : ''}">${DIM_LABELS[d]}</span>`
            ).join('')}</div>
          </div>

          <button class="pc-toggle pc-toggle-more" onclick="toggleCard('${t.id}')">Full Details</button>
          <button class="pc-toggle pc-toggle-less" onclick="toggleCard('${t.id}')">Collapse</button>

          <div class="pc-full">
            <div class="pc-full-section">
              <h5>💎 Hidden Strengths (Detail)</h5>
              <ul class="pc-full-list s">${(t.hiddenStrengths || []).map(s => `<li>${s}</li>`).join('')}</ul>
            </div>
            <div class="pc-full-section">
              <h5>🔍 Blind Spots (Detail)</h5>
              <ul class="pc-full-list w">${(t.hiddenWeaknesses || []).map(s => `<li>${s}</li>`).join('')}</ul>
            </div>
            <div class="pc-full-section">
              <h5>⛏️ Future Assets (Detail)</h5>
              <ul class="pc-full-list a">${(t.futureMiningAssets || []).map(s => `<li>${s}</li>`).join('')}</ul>
            </div>
            <div class="pc-full-section">
              <h5>🚀 Career Directions (Detail)</h5>
              ${(t.careerDirections || []).map(c => `
                <div class="pc-full-career">
                  <strong>${c.title}</strong><span class="fc-field">${c.field}</span>
                  <p>${c.why}</p>
                </div>
              `).join('')}
            </div>
            <div class="pc-full-section">
              <h5>🌅 Hopeful Goals (Detail)</h5>
              <ul class="pc-full-list g">${(t.hopefulGoals || []).map(s => `<li>${s}</li>`).join('')}</ul>
            </div>
          </div>

        </div>
      </div>`;
    }

    function toggleCard(id) {
      const card = document.getElementById('card-' + id);
      if (card) card.classList.toggle('expanded');
    }
  </script>
</body>
</html>
